<template>
    <!-- CUSTOM COMMUNITY UTILITY BAR BUTTON (Only visible in Experience Cloud via Wrapper) -->
    <template if:true={isCommunityMode}>
        <button class="community-utility-button" onclick={toggleCommunityPanel}>
            <lightning-icon icon-name="utility:notification" size="x-small"></lightning-icon>
            <span class="slds-m-left_x-small slds-truncate slds-text-heading_small">Job Alerts ({alertCount})</span>
            <template if:true={hasAlerts}>
                <span class="community-utility-badge"></span>
            </template>
        </button>
    </template>

    <!-- MAIN PANEL (Adapts CSS based on Context) -->
    <div class={panelContainerClass}>
        <div class="slds-panel__header">
            <h2 class="slds-panel__header-title slds-text-heading_small slds-truncate" title="High Priority Jobs">
                High Priority Jobs ({alertCount})
            </h2>

            <div class="slds-panel__header-actions slds-is-relative">
                <!-- Close Button (Only for Community Context) -->
                <template if:true={isCommunityMode}>
                    <lightning-button-icon icon-name="utility:minimize_window" variant="bare" alternative-text="Close Panel" onclick={toggleCommunityPanel} class="slds-m-right_small"></lightning-button-icon>
                </template>

                <lightning-button-icon icon-name="utility:refresh" variant="bare" alternative-text="Sync Territories"
                    onclick={handleRefresh} title="Sync Territory Filters" class="slds-m-right_small">
                </lightning-button-icon>

                <lightning-button-icon icon-name="utility:undo" variant="bare"
                    alternative-text="Restore Dismissed Alerts" onclick={handleUndoDismissAll}
                    title="Restore Dismissed Alerts" class="slds-m-right_small">
                </lightning-button-icon>

                <lightning-button-icon icon-name="utility:clear" variant="bare" alternative-text="Dismiss All"
                    onclick={handleDismissAll} title="Dismiss All (Personal)">
                </lightning-button-icon>
            </div>
        </div>

        <div class="slds-panel__body" style="height: 100%; overflow-y: auto; padding-bottom: 60px;">
            <ul class="slds-notification-list">
                <template for:each={alerts} for:item="alert">
                    <li class="slds-notification-list__item slds-p-around_x-small" key={alert.Id}>
                        <div class="slds-notification slds-theme_warning slds-p-around_small slds-box slds-box_x-small">
                            <div class="slds-notification__body slds-w-full">
                                <div class="slds-notification__target slds-w-full">

                                    <div class="slds-grid slds-grid_vertical-align-center slds-m-bottom_xx-small">
                                        <a href="javascript:void(0);" data-id={alert.saId} onclick={handleNavigate}
                                            class="slds-text-heading_small slds-text-link">
                                            {alert.saNumber}
                                        </a>

                                            <lightning-button-icon icon-name="utility:filterList" variant="bare"
                                                size="small" alternative-text="Filter Gantt"
                                                title="Show only this SA on Gantt" data-id={alert.saId}
                                                onclick={handleFilterGantt}
                                                class="slds-m-left_small slds-m-right_xxx-small">
                                            </lightning-button-icon>

                                        <lightning-button-icon icon-name="utility:copy" variant="bare" size="small"
                                            alternative-text="Copy SA Number" title="Copy to Clipboard"
                                            data-sa={alert.saNumber} onclick={handleCopy}
                                            class="slds-m-left_xx-small slds-m-right_x-small"></lightning-button-icon>

                                        <span class="slds-text-body_small slds-text-color_default">
                                            | <strong>Priority:</strong> {alert.priority}
                                        </span>
                                    </div>

                                    <div class="slds-text-body_small slds-text-color_default">
                                        <p class="slds-m-bottom_xxx-small">
                                            <strong>WOT NUMBER:</strong> {alert.woTaskNumber}
                                        </p>

                                        <p class="slds-m-bottom_xxx-small">
                                            <strong>Type:</strong> {alert.workType}
                                        </p>

                                        <p class="slds-m-bottom_xxx-small">
                                            <strong>EarlyStart: </strong>
                                            <lightning-formatted-date-time value={alert.earlyStart} year="numeric"
                                                month="short" day="2-digit" hour="2-digit" minute="2-digit">
                                            </lightning-formatted-date-time>
                                        </p>

                                        <p class="slds-m-bottom_xxx-small">
                                            <strong>DueDate: </strong>
                                            <lightning-formatted-date-time value={alert.dueDate} year="numeric"
                                                month="short" day="2-digit" hour="2-digit" minute="2-digit">
                                            </lightning-formatted-date-time>
                                        </p>

                                        <p class="slds-m-bottom_xxx-small">
                                            <strong>Territory: </strong>{alert.territoryName}
                                        </p>

                                        <p class="slds-m-bottom_xxx-small">
                                            <strong>Created: </strong>
                                            <lightning-formatted-date-time value={alert.createdDate} year="numeric"
                                                month="short" day="2-digit" hour="2-digit" minute="2-digit">
                                            </lightning-formatted-date-time>
                                        </p>

                                        <p>
                                            <strong>Address: </strong>{alert.address}
                                        </p>
                                    </div>

                                </div>
                            </div>

                            <div class="slds-notification__actions slds-m-top_x-small slds-grid slds-grid_align-end">
                                    <lightning-button-icon icon-name="utility:check" variant="border-filled"
                                        alternative-text="Acknowledge" title="Acknowledge (Global)" data-id={alert.Id}
                                        onclick={handleAcknowledge}></lightning-button-icon>
                                <lightning-button-icon icon-name="utility:close" variant="border-filled"
                                    alternative-text="Dismiss" title="Dismiss (Personal)" data-id={alert.Id}
                                    onclick={handleDismiss} class="slds-m-left_xx-small"></lightning-button-icon>
                            </div>
                        </div>
                    </li>
                </template>

                <template if:false={hasAlerts}>
                    <div class="slds-p-around_medium slds-text-align_center slds-text-color_weak">
                        No high-priority alerts match your loaded filters.
                    </div>
                </template>
            </ul>
        </div>

        <audio class="alert-buzzer" src={buzzerUrl}></audio>
    </div>
</template>
